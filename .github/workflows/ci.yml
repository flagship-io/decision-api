name: CI pipeline
# This workflow is triggered on pushes to the repository.
on:
  push:
  workflow_call:

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: false
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with the Go version above: golangci-lint refuses a module targeting a Go
          # version newer than the one it was built with. Test files are excluded in .golangci.yml.
          version: v2.13.1
          args: --timeout=5m
  build:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Run tests
        run: go test -race -coverpkg=./... ./... -coverprofile cover.out.tmp -covermode=atomic
      - name: Removes mocks from tests
        run: cat cover.out.tmp | grep -v "_mock.go" > cover.out
      - uses: codecov/codecov-action@v7
        with:
          files: ./cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
